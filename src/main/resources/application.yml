spring :
  datasource :
    url : ${SKYLINK_DB_URL}
    username : ${SKYLINK_DB_USERNAME}
    password : ${SKYLINK_DB_PASSWORD}
    driver-class-name : com.mysql.cj.jdbc.Driver
  jpa :
    hibernate :
      ddl-auto : ${SKYLINK_JPA_DDL_AUTO:validate}
    show-sql : true
    database-platform : org.hibernate.dialect.MySQL8Dialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
